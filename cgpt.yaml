apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgpt-releaseskylark
  namespace: releaseskylark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgpt
  template:
    metadata:
      labels:
        app: cgpt
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: cgpt
          image: "kpisoft/chatgpt:skylark-7.0-14082024040321-ae4ccd80dda786cb3ab29d4c557e57904b1b126c-release"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cgpt-releaseskylark-env
          env:
            - name: CT_BASE_URL
              value: releaseskylark_ct:2020/
            - name: DB_CON_STR
              value: mongodb+srv://releaseskylark_user:4bADelfgwNNtxHRm@releaseskylark-qa.znilejx.mongodb.net/releaseskylark_epms?ssl=true&retryWrites=true&w=majority
