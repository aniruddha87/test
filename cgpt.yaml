              value: releaseskylark_epms:3119/epms/
            - name: NODE_OPTIONS
              value: --openssl-legacy-provider
            - name: OPENAI_API_KEY
              value: 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
            - name: PROTOCOL
              value: https
            - name: REDIS_CON_STR
              value: redis://nonprod-redis.g7qsgv.ng.0001.aps1.cache.amazonaws.com:6379/1
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1024Mi
              cpu: 200m
