              value: releaseskylark_epms:3119/epms/
            - name: NODE_OPTIONS
              value: --require @opentelemetry/auto-instrumentations-node/register
            - name: OPENAI_API_KEY
              value:
            - name: PROTOCOL
              value: https
            - name: REDIS_CON_STR
              value:
          resources:
