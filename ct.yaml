apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-releaseskylark
  namespace: releaseskylark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ct
  template:
    metadata:
      labels:
        app: ct
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ct
          image: "kpisoft/maprecruit:skylark-7.0-16082024100409-4768cb5c630b7a18e026a2577426b6b7315d6dc3-release-null"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2020
          envFrom:
            - configMapRef:
                name: ct-releaseskylark-env
          env:
            - name: CT_BASE_URL
              value:
            - name: DB_CON_STR
              value: mongodb+srv://releaseskylark_user:4bADelfgwNNtxHRm@releaseskylark-qa.znilejx.mongodb.net/releaseskylark_epms?ssl=true&retryWrites=true&w=majority
